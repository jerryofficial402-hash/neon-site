<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/theme.min.css">
<style>body{margin:0;padding:20px;background:#fff}.nx-j3{max-width:1240px;margin:0 auto}.nx-j3-gl{position:absolute;inset:0}.nx-j3-gl canvas{width:100%;height:100%;display:block}</style></head>
<body>
<div class="nx-j3" data-step="0">
 <div class="nx-j3-gl"></div>
 <div class="nx-j3-hud" aria-live="polite"><span class="nx-j3-num">1</span><div><b>Get your quote</b><p>Enter two ZIP codes.</p></div></div>
 <div class="nx-j3-progress" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
 <button type="button" class="nx-j3-play" aria-label="Pause animation"><svg viewBox="0 0 24 24"><path class="i-pause" d="M7 5h3v14H7zM14 5h3v14h-3z"/><path class="i-play" d="M8 5l11 7-11 7z"/></svg></button>
</div>
<ol class="nx-jr-steps">
 <li><button type="button"><b>Get your quote</b><span class="nx-jr-t">Enter two ZIP codes and your vehicle.</span></button></li>
 <li><button type="button"><b>We match a carrier</b><span class="nx-jr-t">We book the best fit.</span></button></li>
 <li><button type="button"><b>Pickup &amp; inspection</b><span class="nx-jr-t">Bill of Lading.</span></button></li>
 <li><button type="button"><b>In transit</b><span class="nx-jr-t">Driver's number.</span></button></li>
 <li><button type="button"><b>Delivered</b><span class="nx-jr-t">Inspect and sign.</span></button></li>
</ol>
<script type="module">
import { initJourney3D } from '/js/journey3d.js';
const q = new URLSearchParams(location.search), n = k => q.has(k) ? parseFloat(q.get(k)) : undefined;
window.J3 = initJourney3D(document.querySelector('.nx-j3'), { v: Date.now(), truckRot: n('tr'), trailerRot: n('rr'), hitch: n('h'), instant: q.has('s'), step: n('s') || 0 });
</script>
</body></html>

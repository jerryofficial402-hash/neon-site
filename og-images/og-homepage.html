<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="google-site-verification" content="k1EGgbZH804OPpZC7lIPBJPs2nji6M3U25pigd6MVK8" />
<meta name="viewport" content="width=1200">
<title>Neon Auto Transport — Move Vehicles Forward</title>
<style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #0a2540 0%, #1a3a5c 100%); position: relative; }
 .logo { position: absolute; top: 40px; left: 40px; z-index: 10; font-size: 22px; font-weight: 900; letter-spacing: 1px; }
 .logo span { color: #00d4ff; }
 .watermark { position: absolute; top: -30px; right: 20px; font-size: 320px; font-weight: 900; color: white; opacity: 0.05; letter-spacing: -10px; line-height: 1; z-index: 1; }
 .content { position: absolute; bottom: 60px; left: 40px; z-index: 10; }
 .headline { font-size: 64px; font-weight: 900; color: white; line-height: 1.1; margin-bottom: 8px; }
 .underline { width: 120px; height: 4px; background: #39FF14; margin-bottom: 16px; border-radius: 2px; }
 .subtext { font-size: 20px; color: rgba(255,255,255,0.7); font-weight: 500; }
 .url { position: absolute; bottom: 30px; right: 40px; font-size: 14px; color: rgba(255,255,255,0.4); z-index: 10; }
</style>
 <link rel="stylesheet" href="/css/tailwind.css">
  <style>
   @media (min-width: 1024px) {
    html { font-size: 110%; }
   }
  </style>
 
<style>
@media (max-width: 1024px) { #sticky-widget { display: none !important; } body { padding-bottom: 80px !important; } }
</style>
</head>
<body>
 <div class="logo">NEON <span>AUTO TRANSPORT</span></div>
 <div class="watermark">NAT</div>
 <div class="content">
  <h1 class="headline">Move Vehicles Forward.</h1>
  <div class="underline"></div>
  <p class="subtext">Door-to-door · All 50 States · FMCSA Approved</p>
 </div>
 <div class="url">neonautotransport.com</div>

  
  <!-- Mobile Sticky CTA -->
  <style>
   #mobile-sticky-cta { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 50; padding: 12px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid #e6e6e6; box-shadow: 0 -4px 10px -1px rgba(0,0,0,0.1); display: flex; gap: 12px; align-items: center; justify-content: space-between; box-sizing: border-box; }
   @media (min-width: 1024px) { #mobile-sticky-cta { display: none !important; } }
   .mobile-cta-btn { flex: 1; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; border-radius: 8px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: 'Inter', sans-serif; font-size: 15px; box-sizing: border-box; }
   .mobile-cta-btn.call { background-color: #39FF14; color: #0a2540; }
   .mobile-cta-btn.quote { background-color: #0a2540; color: #ffffff; }
   .mobile-cta-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  </style>
  <div id="mobile-sticky-cta">
    <a href="tel:5715767711" class="mobile-cta-btn call">
      <svg fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path></svg>
      Call Now
    </a>
    <a href="/quote/" class="mobile-cta-btn quote">
      Get Quote
    </a>
  </div>

  <script>
    // Mobile Menu Toggle
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if(mobileMenuBtn && mobileMenu) {
      mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
      });
    }

    // Scroll Reveal
    function reveal() {
      var reveals = document.querySelectorAll('.reveal');
      for (var i = 0; i < reveals.length; i++) {
        var windowHeight = window.innerHeight;
        var elementTop = reveals[i].getBoundingClientRect().top;
        var elementVisible = 50;
        if (elementTop < windowHeight - elementVisible) {
          reveals[i].classList.add('active');
        }
      }
    }
    window.addEventListener('scroll', reveal);
    // Trigger once on load
    reveal();
  </script>
</body>
</html>
